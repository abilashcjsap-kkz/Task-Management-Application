{% extends 'base.html' %}
{% block content %}
<section class="card">
  <h2>Member Management</h2>
  <form method="post" class="inline-form wrap">
    <input name="username" placeholder="Username" required />
    <input type="password" name="password" placeholder="Password" required />
    <button class="btn primary" type="submit">Create Member</button>
  </form>
</section>

<section class="card">
  <table>
    <thead>
      <tr>
        <th>Username</th>
        <th>Created</th>
        <th>Reset Password</th>
        <th>Delete</th>
      </tr>
    </thead>
    <tbody>
      {% for member in members %}
      <tr>
        <td>{{ member['username'] }}</td>
        <td>{{ member['created_at'] }}</td>
        <td>
          <form action="{{ url_for('reset_password', member_id=member['id']) }}" method="post" class="inline-form">
            <input type="password" name="new_password" placeholder="New password" required />
            <button class="btn" type="submit">Reset</button>
          </form>
        </td>
        <td>
          <form action="{{ url_for('delete_member', member_id=member['id']) }}" method="post">
            <button class="btn danger" type="submit">Delete</button>
          </form>
        </td>
      </tr>
      {% else %}
      <tr><td colspan="4">No members found.</td></tr>
      {% endfor %}
    </tbody>
  </table>
</section>
{% endblock %}
