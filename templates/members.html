{% extends 'base.html' %}
{% block content %}
<section class="card">
  <h2>User Management (Members & Managers)</h2>
  <form method="post" class="inline-form wrap">
    <input name="username" placeholder="Name" required />
    <input type="email" name="email" placeholder="Mail Id" required />
    <input type="password" name="password" placeholder="Password" required />
    <select name="role" required>
      <option value="member">Member</option>
      <option value="manager">Manager</option>
    </select>
    <button class="btn primary" type="submit">Create User</button>
  </form>
</section>

<section class="card">
  <table>
    <thead>
      <tr>
        <th>Name</th>
        <th>Mail Id</th>
        <th>Role</th>
        <th>Created</th>
        <th>Reset Password</th>
        <th>Delete</th>
      </tr>
    </thead>
    <tbody>
      {% for user in users %}
      <tr>
        <td>{{ user['username'] }}</td>
        <td>{{ user['email'] }}</td>
        <td>{{ user['role'] }}</td>
        <td>{{ user['created_at'] }}</td>
        <td>
          <form action="{{ url_for('reset_password', user_id=user['id']) }}" method="post" class="inline-form">
            <input type="password" name="new_password" placeholder="New password" required />
            <button class="btn" type="submit">Reset</button>
          </form>
        </td>
        <td>
          <form action="{{ url_for('delete_member', user_id=user['id']) }}" method="post">
            <button class="btn danger" type="submit">Delete</button>
          </form>
        </td>
      </tr>
      {% else %}
      <tr><td colspan="6">No users found.</td></tr>
      {% endfor %}
    </tbody>
  </table>
</section>
{% endblock %}
