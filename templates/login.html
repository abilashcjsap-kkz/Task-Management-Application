{% extends 'base.html' %}
{% block content %}
<section class="card narrow">
  <h2>Login</h2>
  <form method="post" class="form-grid">
    <input type="hidden" name="action" value="login" />
    <label>Username <input name="username" required /></label>
    <label>Password <input type="password" name="password" required /></label>
    <button class="btn primary" type="submit">Login</button>
  </form>
  <p class="hint">Demo users: admin/admin123, manager/manager123, manager2/manager123, member/member123</p>
  <a href="#" id="open-password-modal">Change Password</a>
</section>

<div id="password-modal" class="modal hidden">
  <div class="modal-content card">
    <div class="modal-header">
      <h3>Change Password</h3>
      <button id="close-password-modal" class="btn" type="button">Close</button>
    </div>
    <form method="post" class="form-grid">
      <input type="hidden" name="action" value="change_password" />
      <label>Username <input name="username" required /></label>
      <label>Old Password <input type="password" name="old_password" required /></label>
      <label>New Password <input type="password" name="new_password" required /></label>
      <label>Confirm Password <input type="password" name="confirm_password" required /></label>
      <button class="btn primary" type="submit">Change Password</button>
    </form>
  </div>
</div>

<script>
  const openBtn = document.getElementById('open-password-modal');
  const closeBtn = document.getElementById('close-password-modal');
  const modal = document.getElementById('password-modal');

  openBtn.addEventListener('click', function (e) {
    e.preventDefault();
    modal.classList.remove('hidden');
  });

  closeBtn.addEventListener('click', function () {
    modal.classList.add('hidden');
  });

  modal.addEventListener('click', function (e) {
    if (e.target === modal) {
      modal.classList.add('hidden');
    }
  });
</script>
{% endblock %}
